<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1577D6">
<title>BaanHub · Design 5D — Portal Living</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal-base.css">
<style>
  /* 5D Living — โครงแบบพอร์ทัลประกาศยอดนิยมของไทย: เมนู 2 ชั้น, การ์ด เช่า/ซื้อ + ช่องค้นหาเดียว, ไอคอนประเภทในวงกลม,
     การ์ดประกาศมีแท็ก/สเปก/ราคาต่อ ตร.ม./ยอดเข้าชม, หน้ารายละเอียดมีแถบติดต่อ agent ติดล่างจอทุกขนาด */
  :root {
    --font: 'Noto Sans Thai', system-ui, sans-serif;
    --bg: #F5F8FC; --surface: #FFFFFF; --surface-2: #F3F7FC;
    --ink: #142033; --muted: #56627A; --line: #E2E8F1; --line-strong: #C8D2E0;
    --primary: #1577D6; --primary-strong: #0B6BCB; --primary-deep: #0A4F99; --primary-soft: #E8F2FD; --primary-ring: rgba(21, 119, 214, .22);
    --accent: #C8460A; --accent-strong: #A93A06; --accent-ink: #FFFFFF; --accent-soft: #FFF0E6;
    --go: #15803D; --go-strong: #116A32; --go-soft: #E6F6EC;
    --ok: #15803D; --fav: #E11D48; --focus: #1577D6; --star: #B7791F;
    --spot1: #22B8CF; --spot2: #4C6EF5;
    --scrim: rgba(12, 22, 40, .55);
    --shadow: 0 2px 8px rgba(20, 32, 51, .06);
    --shadow-lg: 0 14px 36px rgba(20, 32, 51, .16);
    --r-card: 16px; --r-field: 12px;
    --map-bg: #EAF1F8; --map-water: #BBD7F4; --map-park: #CDE8C8; --map-road: #FFFFFF; --map-road2: #DDE5EF; --map-ink: #0A4F99;
    --line-brand: #06C755; --line-bts: #3FA34D; --line-silom: #0E7A5A; --line-mrt: #1F4FB0; --line-purple: #7B3FA0; --line-yellow: #C99A00; --line-pink: #D6457A; --line-arl: #B4232C;
  }
  .btn { min-height: 44px; padding: 0 18px; border-radius: 99px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; white-space: nowrap; font-size: 15px; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-accent { background: var(--accent); color: var(--accent-ink); }
  .btn-go { background: var(--go); color: #fff; }
  .btn-ghost { border: 1px solid var(--line-strong); background: var(--surface); }
  .btn-line { background: var(--surface); border: 1.5px solid var(--line-brand); }
  .btn-line .i { color: var(--line-brand); }
  @media (hover: hover) { .btn-primary:hover { background: var(--primary-strong); } .btn-accent:hover { background: var(--accent-strong); } .btn-go:hover { background: var(--go-strong); } .btn-ghost:hover { border-color: var(--primary); color: var(--primary-strong); } }
  .ib { position: relative; width: 44px; height: 44px; border-radius: 99px; display: grid; place-items: center; color: inherit; }
  .ib .n { position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 99px; background: var(--fav); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  @media (hover: hover) { .ib:hover { background: var(--primary-soft); } }

  /* header 2 ชั้น */
  .hdr { position: sticky; top: 0; z-index: 40; background: linear-gradient(90deg, #EAF6FF 0%, #FFFFFF 40%, #FFFFFF 70%, #EAF6FF 100%); box-shadow: 0 1px 0 var(--line); }
  .hdr-in { display: flex; align-items: center; gap: 8px; min-height: 64px; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 21px; color: var(--primary-deep); min-height: 44px; letter-spacing: -.01em; }
  .logo-mark { width: 34px; height: 34px; display: grid; place-items: center; color: var(--primary); }
  .logo-mark svg { width: 34px; height: 34px; }
  .logo em { font-style: normal; font-weight: 500; color: var(--primary); }
  .hdr-r { margin-left: auto; display: flex; align-items: center; gap: 2px; }
  .rows { display: none; }
  .post { width: 44px; padding: 0; }
  .post span { display: none; }
  @media (min-width: 640px) { .post { width: auto; padding: 0 16px; } .post span { display: inline; } }
  @media (min-width: 1024px) {
    .hdr-in { min-height: 96px; }
    .hdr-r { display: none; }
    .rows { display: flex; flex-direction: column; align-items: flex-end; margin-left: auto; gap: 0; }
    .util { display: flex; align-items: center; gap: 2px; font-size: 13px; color: var(--muted); }
    .util a.t { min-height: 44px; display: inline-flex; align-items: center; padding: 0 8px; }
    .util .sep { width: 1px; height: 14px; background: var(--line-strong); margin: 0 4px; }
    .util .ib { width: 44px; height: 44px; }
    .util .ib .i { width: 18px; height: 18px; }
    .mainnav { display: flex; align-items: center; gap: 2px; }
    .mainnav > a, .mainnav > .qd > button { min-height: 44px; padding: 0 12px; display: inline-flex; align-items: center; gap: 4px; font-weight: 500; font-size: 15px; color: var(--ink); border-radius: 99px; position: relative; white-space: nowrap; }
    .mainnav > a[aria-current="page"] { background: var(--go); color: #fff; }
    .mainnav .new { position: absolute; top: 2px; right: -2px; font-size: 10px; font-weight: 700; background: var(--fav); color: #fff; padding: 0 5px; border-radius: 99px; line-height: 1.5; }
    .mainnav .post { margin-left: 6px; }
    .mainnav > a.btn-accent, .mainnav > a.btn-accent:hover { color: var(--accent-ink); background: var(--accent); border-radius: 99px; box-shadow: none; }
    .menu-btn { display: none; }
  }
  @media (hover: hover) and (min-width: 1024px) { .mainnav > a:hover, .mainnav > .qd > button:hover { color: var(--primary-strong); background: var(--primary-soft); } }
  .qd { position: relative; }
  .qd-pop { position: absolute; top: calc(100% + 6px); right: 0; width: 560px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-lg); padding: 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 16px; z-index: 50; }
  .qd-pop strong { font-size: 14px; color: var(--primary-deep); grid-column: span 1; }
  .qd-pop a { min-height: 40px; display: flex; align-items: center; font-size: 14px; color: var(--muted); }
  @media (hover: hover) { .qd-pop a:hover { color: var(--primary-strong); text-decoration: underline; } }

  /* hero */
  .hero { position: relative; z-index: 3; isolation: isolate; padding: 24px 0 28px; color: #fff; }
  .hero-art { position: absolute; inset: 0; z-index: -2; overflow: hidden; }
  .hero-art svg { width: 100%; height: 100%; }
  .hero::before { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(8, 28, 60, .55), rgba(8, 28, 60, .15) 60%, rgba(8, 28, 60, .35)); }
  .hero h1 { font-size: 22px; line-height: 1.45; font-weight: 700; text-shadow: 0 2px 10px rgba(0, 0, 0, .35); max-width: 30ch; }
  @media (min-width: 768px) { .hero { padding: 40px 0 48px; } .hero h1 { font-size: 30px; max-width: none; } }
  .modes { display: flex; gap: 8px; margin: 16px 0 12px; }
  .mode { flex: 1; min-height: 64px; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 14px; background: rgba(255, 255, 255, .94); color: var(--ink); text-align: left; border: 2px solid transparent; box-shadow: var(--shadow); }
  .mode .mi { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); flex: none; }
  .mode .mi .i { width: 24px; height: 24px; }
  .mode b { display: block; font-size: 17px; line-height: 1.3; }
  .mode small { display: block; font-size: 12px; color: var(--muted); line-height: 1.35; }
  .mode[aria-selected="true"] { background: var(--primary); color: #fff; }
  .mode[aria-selected="true"] small { color: #DCEBFC; }
  .mode[aria-selected="true"] .mi { background: rgba(255, 255, 255, .2); color: #fff; }
  @media (min-width: 640px) { .mode { flex: 0 0 220px; } }
  .spanel { background: var(--surface); color: var(--ink); border-radius: 18px; padding: 12px; box-shadow: var(--shadow-lg); }
  .sline { display: flex; gap: 8px; align-items: stretch; }
  .ac { position: relative; flex: 1; min-width: 0; }
  .ac > .i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .ac .input { min-height: 52px; border-radius: 99px; padding-left: 46px; }
  .ac-list { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg); padding: 6px; z-index: 30; max-height: 320px; overflow: auto; }
  .ac-list li { min-height: 48px; padding: 6px 10px; display: flex; gap: 10px; align-items: center; border-radius: 10px; cursor: pointer; line-height: 1.35; }
  .ac-list li .i { color: var(--primary); }
  .ac-list li small { display: block; color: var(--muted); font-size: 12px; }
  .ac-list li.is-active { background: var(--primary-soft); }
  .ac-list .grp { min-height: 28px; font-size: 12px; color: var(--muted); font-weight: 600; cursor: default; padding: 4px 10px 0; }
  @media (hover: hover) { .ac-list li[role=option]:hover { background: var(--primary-soft); } }
  .sgo { min-height: 52px; padding: 0 18px; font-size: 16px; }
  .sgo span { display: none; }
  @media (min-width: 640px) { .sgo span { display: inline; } .sgo { padding: 0 28px; } }
  .qlinks { display: flex; gap: 4px 6px; flex-wrap: wrap; margin-top: 8px; }
  .qlinks a { min-height: 44px; display: inline-flex; align-items: center; padding: 0 10px; font-size: 14px; font-weight: 500; border-radius: 99px; }
  @media (hover: hover) { .qlinks a:hover { background: var(--primary-soft); color: var(--primary-strong); } }

  /* หัวข้อส่วน */
  .sec { padding: 28px 0 4px; }
  .sec.alt { background: var(--surface); margin-top: 28px; padding-bottom: 28px; }
  .sec-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .sec-h h2 { font-size: 20px; line-height: 1.4; color: var(--primary-deep); }
  .more { color: var(--primary-strong); font-weight: 500; font-size: 14px; display: inline-flex; align-items: center; min-height: 44px; flex: none; text-decoration: underline; text-underline-offset: 3px; }
  .arrows { display: none; gap: 8px; }
  .arrows button { width: 44px; height: 44px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; box-shadow: var(--shadow); }
  @media (min-width: 768px) { .sec { padding: 40px 0 4px; } .sec.alt { margin-top: 40px; padding-bottom: 40px; } .sec-h h2 { font-size: 24px; } .arrows { display: flex; } }
  .track { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; margin: 0 -16px; padding: 4px 16px 8px; scroll-behavior: smooth; }
  .track::-webkit-scrollbar { display: none; }
  .track > * { scroll-snap-align: start; flex: none; }
  @media (min-width: 768px) { .track { margin: 0; padding: 4px 0 8px; } }

  /* ประเภททรัพย์: ไอคอนวงกลม */
  .tcat { width: 84px; min-height: 108px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; font-size: 14px; line-height: 1.35; }
  .tcat .ring { width: 72px; height: 72px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); display: grid; place-items: center; overflow: hidden; }
  .tcat .ring svg { width: 56px; height: 56px; }
  @media (min-width: 1024px) { .tcat { width: calc((100% - 9 * 14px) / 10); } }
  @media (hover: hover) { .tcat:hover .ring { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-ring); } .tcat:hover { color: var(--primary-strong); } }

  /* ทำเลยอดนิยม */
  .loc { position: relative; width: 78%; max-width: 340px; aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden; color: #fff; display: block; }
  .loc:nth-child(even) { width: 52%; max-width: 220px; }
  .loc svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .loc::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(5, 18, 40, .8)); }
  .loc span { position: absolute; z-index: 1; left: 12px; right: 12px; bottom: 10px; line-height: 1.35; }
  .loc strong { display: block; font-size: 16px; }
  .loc small { font-size: 13px; opacity: .92; }
  @media (min-width: 1024px) { .loc { width: 340px; } .loc:nth-child(even) { width: 220px; } }

  /* การ์ดประกาศ */
  .cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  @media (min-width: 640px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (min-width: 1024px) { .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (min-width: 1280px) { .cards.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .track > .lc { width: 82%; max-width: 300px; }
  .lc { position: relative; background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; }
  @media (hover: hover) { .lc:hover { box-shadow: var(--shadow-lg); } }
  .lc .ph { position: relative; aspect-ratio: 4 / 3; background: var(--surface-2); }
  .lc .ph > svg { width: 100%; height: 100%; }
  .spot { position: absolute; left: 0; top: 10px; font-size: 12px; font-weight: 700; color: #fff; padding: 2px 12px 2px 10px; border-radius: 0 99px 99px 0; background: linear-gradient(90deg, #0E7490, #3B5BDB); display: inline-flex; gap: 4px; align-items: center; z-index: 2; }
  .spot .i { width: 14px; height: 14px; }
  .acts { position: absolute; right: 2px; top: 2px; display: flex; z-index: 2; }
  .acts button { width: 44px; height: 44px; display: grid; place-items: center; }
  .acts button span { width: 32px; height: 32px; border-radius: 50%; background: rgba(255, 255, 255, .94); display: grid; place-items: center; color: var(--ink); }
  .acts .i { width: 17px; height: 17px; }
  [data-cmp][aria-pressed="true"] span { background: var(--primary); color: #fff; }
  .lc .who { position: absolute; left: 10px; bottom: 10px; width: 34px; height: 34px; border-radius: 50%; background: var(--surface); color: var(--primary-deep); border: 2px solid #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; z-index: 2; box-shadow: var(--shadow); }
  .lc .dots { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 4px; padding: 3px 6px; border-radius: 99px; background: rgba(0, 0, 0, .35); }
  .lc .dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, .55); }
  .lc .dots i:first-child { background: #fff; }
  .lc .call { position: absolute; right: 8px; bottom: 6px; z-index: 2; min-height: 44px; display: grid; place-items: center; }
  .lc .call span { padding: 2px 12px; border-radius: 99px; background: rgba(20, 32, 51, .62); color: #fff; font-size: 13px; font-weight: 600; }
  .lc .bd { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .tg { font-size: 12px; font-weight: 600; padding: 0 8px; border-radius: 6px; line-height: 1.8; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
  .tg.t-type { background: var(--go); color: #fff; border-color: var(--go); }
  .tg.t-deal { background: var(--go-soft); color: var(--go-strong); border-color: #BFE3CB; }
  .lc h3 { font-size: 15px; line-height: 1.5; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .lc h3 a::after { content: ''; position: absolute; inset: 0; z-index: 1; }
  .meta { font-size: 13px; color: var(--muted); display: flex; gap: 4px; align-items: center; line-height: 1.45; min-width: 0; }
  .meta .i { width: 15px; height: 15px; }
  .meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spec { display: flex; gap: 4px 12px; flex-wrap: wrap; font-size: 13px; color: var(--ink); }
  .spec span { display: inline-flex; gap: 4px; align-items: center; }
  .spec .i { width: 15px; height: 15px; color: var(--muted); }
  .pr { margin-top: 4px; font-size: 20px; font-weight: 700; color: var(--primary-deep); line-height: 1.3; }
  .pr small { font-size: 13px; font-weight: 500; color: var(--muted); }
  .psq { font-size: 12px; color: var(--muted); }
  .ft { margin-top: auto; padding-top: 8px; display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .ft span { display: inline-flex; gap: 4px; align-items: center; }
  .ft .i { width: 14px; height: 14px; }

  /* การ์ดโครงการใหม่ */
  .pj { width: 84%; max-width: 360px; background: var(--surface); border-radius: var(--r-card); border: 1px solid var(--line); box-shadow: var(--shadow); overflow: hidden; position: relative; }
  .pj .ph { position: relative; aspect-ratio: 16 / 10; }
  .pj .ph > svg { width: 100%; height: 100%; }
  .pj .from { position: absolute; right: 10px; bottom: 10px; background: var(--surface); color: var(--ink); border-radius: 12px; padding: 2px 10px; font-size: 12px; text-align: right; line-height: 1.3; }
  .pj .from b { display: block; font-size: 18px; color: var(--accent); }
  .pj .bd { padding: 12px 14px; }
  .pj h3 { font-size: 16px; line-height: 1.45; }
  .pj h3 a::after { content: ''; position: absolute; inset: 0; z-index: 1; }
  .pstat { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 10px -14px; padding: 8px 0; text-align: center; font-size: 12px; color: var(--muted); }
  .pstat b { display: block; font-size: 15px; color: var(--primary-deep); }
  .pj .dev { display: flex; gap: 8px; align-items: center; font-size: 13px; }
  .pj .dev i { width: 28px; height: 28px; border-radius: 8px; background: var(--primary-deep); color: #fff; font-style: normal; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  @media (min-width: 1024px) { .pj { width: calc((100% - 2 * 14px) / 3); max-width: none; } }

  /* agent แนะนำ */
  .ag { width: 72%; max-width: 250px; background: var(--surface); border-radius: var(--r-card); border: 1px solid var(--line); box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; }
  .ag .top { position: relative; aspect-ratio: 5 / 4; background: linear-gradient(160deg, var(--primary-soft), #D5E7FB); display: grid; place-items: center; }
  .ag .face { width: 96px; height: 96px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 30px; font-weight: 700; display: grid; place-items: center; border: 4px solid #fff; }
  .ag .badge { position: absolute; left: 8px; top: 8px; font-size: 12px; font-weight: 700; color: #fff; background: var(--go); padding: 1px 10px; border-radius: 99px; display: inline-flex; gap: 4px; align-items: center; }
  .ag .badge .i { width: 14px; height: 14px; }
  .ag .cbtn { position: absolute; right: 8px; bottom: 8px; }
  .ag .cbtn .btn { min-height: 44px; padding: 0 14px; font-size: 13px; background: rgba(20, 32, 51, .62); color: #fff; }
  .ag .bd { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .ag strong { display: flex; gap: 4px; align-items: center; }
  .ag strong .i { width: 16px; height: 16px; color: var(--go); }
  .ag .rt { font-size: 13px; color: var(--muted); display: flex; gap: 4px; align-items: center; }
  .ag .rt b { color: var(--star); }
  .ag .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .ag .chips span { font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }
  .ag q { font-size: 13px; color: var(--muted); margin-top: auto; padding-top: 6px; border-top: 1px dashed var(--line); quotes: none; }
  @media (min-width: 1024px) { .ag { width: calc((100% - 3 * 14px) / 4); max-width: none; } }

  /* ใกล้รถไฟฟ้า */
  .tlines { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 8px; }
  .tl { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; text-align: center; line-height: 1.3; font-weight: 500; min-height: 44px; }
  .tl .sq { width: 64px; height: 64px; border-radius: 14px; border: 3px solid var(--c); background: var(--surface); display: grid; place-items: center; font-weight: 800; color: var(--c); font-size: 18px; letter-spacing: -.02em; box-shadow: var(--shadow); }
  .tl .sq.m { font-size: 30px; }
  @media (min-width: 768px) { .tlines { grid-template-columns: repeat(8, minmax(0, 1fr)); } .tl .sq { width: 76px; height: 76px; } }
  @media (hover: hover) { .tl:hover .sq { background: var(--c); color: #fff; } }

  /* บทความ */
  .news { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }

      (h.deal === 'sale' ? '<section class="blk" aria-labelledby="h-calc"><h2 id="h-calc">คำนวณสินเชื่อ</h2><div class="calc"><div class="field"><label for="c-down">เงินดาวน์ <b id="c-down-v">10%</b></label><input type="range" id="c-down" min="0" max="50" step="5" value="10"></div><div class="field"><label for="c-yr">ระยะเวลาผ่อน <b id="c-yr-v">30 ปี</b></label><input type="range" id="c-yr" min="5" max="40" step="5" value="30"></div><div class="calc-out"><span>ผ่อนประมาณ (ดอกเบี้ย 3.5%)</span><b id="c-out"></b></div></div></section>' : '') +
      '<section class="looking"><div><h2>ยังไม่เจอ <em>' + esc(h.project ? h.project.name : place) + '</em> ที่ต้องการ?</h2><p style="color:var(--muted)">ฝากความต้องการไว้ agent ในย่านนี้จะเสนอทรัพย์ให้คุณเอง</p></div><a class="btn btn-accent" href="#/looking" onclick="BH.toast(\'ไปหน้าฝากหาทรัพย์\');return false">' + I('search') + 'ฝากหาทรัพย์</a></section>' +
      '</div><aside class="aside-c" aria-label="ผู้ลงประกาศ"><div style="display:flex;gap:12px;align-items:center"><span class="av" style="width:52px;height:52px;border-radius:50%;background:var(--primary-soft);color:var(--primary-deep);display:grid;place-items:center;font-weight:700">' + a.initials + '</span><div><strong>' + esc(a.name) + '</strong><br><small style="color:var(--go);font-weight:600">' + (a.verified ? '✓ Verified' : 'ยังไม่ยืนยันตัวตน') + '</small><small style="color:var(--muted)"> · ' + esc(a.company) + '</small></div></div>' +
      '<p style="font-size:14px;color:var(--muted);margin:10px 0">' + a.reply + ' · ประกาศ ' + a.listings + ' รายการ</p><div style="display:grid;gap:8px"><button class="btn btn-go" type="button" data-contact="' + h.slug + '">' + I('chat') + 'ติดต่อ</button><a class="btn btn-ghost" href="' + B.href('/search', {}) + '" onclick="BH.toast(\'ดูประกาศทั้งหมดของ ' + a.name + '\');return false">ดูประกาศทั้งหมดของ agent</a></div>' +
      '<p style="font-size:13px;color:var(--muted);margin-top:10px">' + I('shield', '') + ' อย่าโอนเงินจองก่อนเห็นทรัพย์จริง</p></aside></div>' +
      '<section class="sec" style="padding-top:8px" aria-labelledby="h-sim"><div class="sec-h"><h2 id="h-sim">ประกาศอื่นๆ ใน' + esc(place) + '</h2><a class="more" href="' + B.href('/search', { prov: h.prov }) + '">ดูทั้งหมด</a></div><div class="cards c4">' + sim.map(function (x) { return card(x, false); }).join('') + '</div></section></div>' +
      '<div class="abar"><div class="wrap abar-in"><span class="av">' + a.initials + '</span><span class="nm"><b><span>' + esc(a.name) + '</span>' + (a.verified ? '<span class="vf">' + I('shield') + 'Verified</span>' : '') + '</b><small>' + esc(a.company) + ' · ' + B.priceText(h) + '</small></span>' +
      '<a class="ib" href="tel:' + a.phone.replace(/-/g, '') + '" aria-label="โทรหา ' + esc(a.name) + '">' + I('phone') + '</a><a class="ib hide-xs" href="#line" aria-label="แชต LINE" style="color:var(--line-brand)" onclick="BH.toast(\'เปิด LINE\');return false">' + I('line') + '</a><button class="btn btn-go" type="button" data-contact="' + h.slug + '">' + I('chat') + 'ติดต่อ</button></div></div>';

    var drawNear = function (k) { B.$('#near').innerHTML = (NEAR[k].length ? NEAR[k] : [['pin', 'ยังไม่มีข้อมูลในหมวดนี้', '']]).map(function (x) { return '<li>' + I(x[0]) + '<span>' + esc(x[1]) + '</span><span>' + x[2] + '</span></li>'; }).join(''); };
    B.$$('[data-near]').forEach(function (b) { b.addEventListener('click', function () { B.$$('[data-near]').forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); drawNear(b.dataset.near); }); });
    drawNear('all');
    B.$('#more').addEventListener('click', function (e) {
      var d = B.$('#desc'), open = d.classList.toggle('clip') === false; e.currentTarget.setAttribute('aria-expanded', open);
      e.currentTarget.firstChild.textContent = open ? 'ย่อรายละเอียด' : 'แสดงรายละเอียดเพิ่มเติม';
    });
    if (h.deal === 'sale') {
      var upd = function () { var d = +B.$('#c-down').value, y = +B.$('#c-yr').value; B.$('#c-down-v').textContent = d + '%'; B.$('#c-yr-v').textContent = y + ' ปี'; B.$('#c-out').textContent = B.baht(B.mortgage(h.price, d, y, 3.5)) + '/เดือน'; };
      ['c-down', 'c-yr'].forEach(function (id) { B.$('#' + id).addEventListener('input', upd); }); upd();
    }
  }

  /* อีเวนต์ที่ใช้ทุกหน้า */
  var cmp = {};
  document.addEventListener('click', function (e) {
    var c = e.target.closest('[data-contact]'); if (c) { e.preventDefault(); e.stopPropagation(); openContact(B.find(c.dataset.contact)); return; }
    var m = e.target.closest('[data-cmp]');
    if (m) { e.preventDefault(); e.stopPropagation(); var s = m.dataset.cmp; if (cmp[s]) delete cmp[s]; else cmp[s] = 1; var n = Object.keys(cmp).length;
      B.$$('[data-cmp="' + s + '"]').forEach(function (x) { x.setAttribute('aria-pressed', !!cmp[s]); }); B.toast(cmp[s] ? 'เพิ่มในรายการเปรียบเทียบ (' + n + '/4)' : 'นำออกจากการเปรียบเทียบ'); return; }
    var sc = e.target.closest('[data-scroll]'); if (sc) { var t = B.$('#' + sc.dataset.scroll); t.scrollBy({ left: +sc.dataset.dir * t.clientWidth * .8, behavior: 'smooth' }); return; }
    var qd = e.target.closest('[data-qd]'); var pop = B.$('#qd-pop');
    if (qd) { var open = pop.hidden; pop.hidden = !open; qd.setAttribute('aria-expanded', open); return; }
    if (pop && !pop.hidden && !e.target.closest('#qd-pop')) { pop.hidden = true; B.$('[data-qd]').setAttribute('aria-expanded', 'false'); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var pop = B.$('#qd-pop'); if (pop && !pop.hidden) { pop.hidden = true; var b = B.$('[data-qd]'); b.setAttribute('aria-expanded', 'false'); b.focus(); }
    if (!B.$('#sheet').hidden) closeSheet();
  });

  function navHtml(st) {
    return NAV.map(function (n) {
      if (n.quick) return '<div class="qd"><button type="button" data-qd aria-expanded="false" aria-controls="qd-pop">' + n.label + I('chev') + '</button><div class="qd-pop" id="qd-pop" hidden>' +
        DIR.slice(0, 3).map(function (d) { return '<div><strong>' + d[0] + '</strong>' + d[1].slice(0, 4).map(function (z) { return '<a href="' + B.href('/search', Object.assign({}, d[2], { q: z })) + '">' + d[0].split(' ')[0] + ' ' + z + '</a>'; }).join('') + '</div>'; }).join('') + '</div></div>';
      if (n.href) return '<a href="' + n.href + '" onclick="BH.toast(\'' + n.toast + '\');return false">' + n.label + (n.isNew ? '<span class="new">ใหม่</span>' : '') + '</a>';
      var on = st.view === 'search' && Object.keys(n.q).every(function (k) { return st.q[k] === n.q[k]; }) && (n.q.market || !st.q.market);
      return '<a href="' + B.href('/search', n.q) + '"' + (on ? ' aria-current="page"' : '') + '>' + n.label + '</a>';
    }).join('') + '<a class="btn btn-accent post" href="#/post" onclick="BH.toast(\'ไปหน้าลงประกาศ\');return false">' + I('plus') + '<span>ลงประกาศ</span></a>';
  }

  B.$('#drawer-links').innerHTML = '<a href="#/">' + I('home') + 'หน้าแรก</a>' + NAV.filter(function (n) { return !n.quick; }).map(function (n) {
    return n.href ? '<a href="' + n.href + '" onclick="BH.toast(\'' + n.toast + '\');return false">' + I('user') + n.label + '</a>' : '<a href="' + B.href('/search', n.q) + '">' + I('search') + n.label + '</a>';
  }).join('');
  B.$('#dir').innerHTML = '<div class="wrap"><h2>ค้นหาตามทำเลและประเภท</h2><div class="dir-g">' + DIR.map(function (d) {
    return '<div><h3>' + d[0] + '</h3>' + d[1].map(function (z) { return '<a href="' + B.href('/search', Object.assign({}, d[2], { q: z })) + '">' + d[0].split(' ')[0] + ' ' + z + '</a>'; }).join('') + '</div>';
  }).join('') + '</div></div>';
  B.$('#ftr').innerHTML = '<div class="wrap"><div class="ftr-g"><div class="brand"><strong style="font-size:20px;color:#fff">BaanHub</strong><p style="max-width:42ch;margin-top:4px">เว็บประกาศซื้อ ขาย ให้เช่า อสังหาฯ ทั่วไทย ลงประกาศฟรี</p></div>' +
    '<div><h3>ค้นหา</h3><a href="#/search?deal=sale">ซื้อ</a><a href="#/search?deal=rent">เช่า</a><a href="#/search?deal=sale&market=new">โครงการใหม่</a></div><div><h3>สมาชิก</h3><a href="#/post" onclick="BH.toast(\'ไปหน้าลงประกาศ\');return false">ลงประกาศ</a><a href="#/agent-login" onclick="BH.toast(\'ไปหน้าเข้าสู่ระบบ agent\');return false">เข้าสู่ระบบ agent</a></div>' +
    '<div><h3>ช่วยเหลือ</h3><a href="#/help" onclick="BH.toast(\'เปิดคู่มือการใช้งาน\');return false">คู่มือการใช้งาน</a><a href="#/privacy" onclick="BH.toast(\'เปิดนโยบายความเป็นส่วนตัว\');return false">ความเป็นส่วนตัว</a></div></div><p style="margin-top:20px;font-size:13px">© 2569 BaanHub · ข้อมูลในหน้านี้เป็นข้อมูลตัวอย่าง</p></div>';

  B.start(function (st) {
    if (!B.$('#sheet').hidden) closeSheet();
    document.body.classList.toggle('on-detail', st.view === 'detail');
    B.$('#nav').innerHTML = navHtml(st);
    if (st.view === 'search') search(st); else if (st.view === 'detail') detail(st); else home();
    B.$$('[data-fav-count]').forEach(function (x) { x.textContent = B.favCount(); x.hidden = !B.favCount(); });
    document.title = 'BaanHub · 5D Living — ' + (st.view === 'home' ? 'หน้าแรก' : st.view === 'search' ? 'ค้นหา' : 'รายละเอียด');
  });
})();
</script>
</body>
</html>
