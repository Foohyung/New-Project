<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1D4ED8">
<title>BaanHub · Design 5C — Portal Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal-base.css">
<style>
  /* 5C Showcase — เน้นโครงการใหม่: แบนเนอร์โครงการเลื่อนได้ + กล่องค้นหาลอยทับ, น้ำเงินสด + เหลืองอำพัน */
  :root {
    --font: 'Sarabun', system-ui, sans-serif; --font-h: 'Kanit', 'Sarabun', sans-serif;
    --bg: #F5F7FB; --surface: #FFFFFF; --surface-2: #F8FAFF;
    --ink: #101828; --muted: #526077; --line: #E4E8F0; --line-strong: #C9D1DF;
    --primary: #1D4ED8; --primary-strong: #1A3FB0; --primary-soft: #EAF0FF; --primary-ring: rgba(29, 78, 216, .22);
    --accent: #F59E0B; --accent-strong: #E08A00; --accent-ink: #101828; --accent-soft: #FFF5DD;
    --deep: #0B1B3F; --deep-ink: #FFFFFF; --deep-muted: #B7C3DD;
    --ok: #047857; --ok-soft: #E3F6EE; --fav: #E11D48; --focus: #1D4ED8;
    --scrim: rgba(11, 27, 63, .55);
    --shadow: 0 1px 3px rgba(16, 24, 40, .07);
    --shadow-lg: 0 16px 40px rgba(11, 27, 63, .18);
    --r-card: 16px; --r-field: 12px;
    --map-bg: #EDF1F8; --map-water: #C0D6F6; --map-park: #CFE7C6; --map-road: #FFFFFF; --map-road2: #E0E6F0; --map-ink: #1D4ED8;
    --line-brand: #06C755; --line-bts: #3FA34D; --line-silom: #0E7A5A; --line-mrt: #1F4FB0; --line-purple: #7B3FA0; --line-yellow: #C99A00;
  }
  h1, h2, h3 { font-family: var(--font-h); font-weight: 600; letter-spacing: 0; }
  .btn { min-height: 44px; padding: 0 18px; border-radius: 99px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; white-space: nowrap; font-size: 15px; }
  .btn-accent { background: var(--accent); color: var(--accent-ink); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-ghost { border: 1px solid var(--line-strong); background: var(--surface); }
  .btn-white { background: #fff; color: var(--ink); }
  .btn-line { background: var(--surface); border: 1.5px solid var(--line-brand); }
  .btn-line .i { color: var(--line-brand); }
  @media (hover: hover) { .btn-accent:hover { background: var(--accent-strong); } .btn-primary:hover { background: var(--primary-strong); } .btn-ghost:hover { border-color: var(--primary); color: var(--primary); } }
  .ib { position: relative; width: 44px; height: 44px; border-radius: 99px; display: grid; place-items: center; }
  .ib .n { position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 99px; background: var(--fav); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  @media (hover: hover) { .ib:hover { background: var(--primary-soft); } }

  .hdr { position: sticky; top: 0; z-index: 40; background: var(--surface); box-shadow: 0 1px 0 var(--line); }
  .hdr-in { height: 64px; display: flex; align-items: center; gap: 8px; }
  .logo { display: flex; align-items: center; gap: 8px; font-family: var(--font-h); font-weight: 600; font-size: 22px; color: var(--ink); min-height: 44px; }
  .logo-mark { width: 36px; height: 36px; border-radius: 12px; background: linear-gradient(135deg, var(--primary), #3B82F6); color: #fff; display: grid; place-items: center; }
  .logo em { font-style: normal; color: var(--primary); }
  .nav { display: none; }
  .hdr-r { margin-left: auto; display: flex; gap: 4px; align-items: center; }
  .post { width: 44px; padding: 0; } .post span, .sell { display: none; }
  @media (min-width: 640px) { .post { width: auto; padding: 0 18px; } .post span { display: inline; } }
  @media (min-width: 1024px) {
    .nav { display: flex; gap: 4px; margin-left: 24px; }
    .nav a { min-height: 44px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 99px; font-weight: 600; color: var(--muted); }
    .nav a[aria-current="page"] { background: var(--primary-soft); color: var(--primary); }
    .sell { display: inline-flex; } .menu-btn { display: none; }
  }
  @media (hover: hover) { .nav a:hover { color: var(--ink); background: var(--surface-2); } }

  /* แบนเนอร์โครงการ */
  .banner { position: relative; height: 440px; overflow: hidden; background: var(--deep); color: #fff; }
  .slides { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .slides::-webkit-scrollbar { display: none; }
  .slide { flex: 0 0 100%; position: relative; scroll-snap-align: start; }
  .slide > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .slide::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11, 27, 63, .15) 0%, rgba(11, 27, 63, .82) 78%); }
  .slide-t { position: absolute; z-index: 1; left: 0; right: 0; bottom: 96px; }
  .slide-t .promo { display: inline-flex; gap: 6px; align-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 13px; padding: 2px 10px; border-radius: 99px; }
  .slide-t h2 { font-size: 26px; line-height: 1.3; margin: 8px 0 2px; }
  .slide-t p { color: #E3E9F6; font-size: 15px; }
  .slide-t .from { font-size: 15px; margin-top: 6px; }
  .slide-t .from b { font-family: var(--font-h); font-size: 22px; color: var(--accent); font-weight: 600; }
  .slide-t .btn { margin-top: 12px; }
  .bctl { position: absolute; z-index: 2; right: 16px; bottom: 100px; display: flex; gap: 6px; align-items: center; }
  .bctl .ib { background: rgba(255, 255, 255, .18); color: #fff; border: 1px solid rgba(255, 255, 255, .35); }
  .dots { position: absolute; z-index: 2; left: 0; right: 0; bottom: 70px; display: flex; justify-content: center; gap: 0; }
  .dots button { width: 44px; height: 44px; display: grid; place-items: center; }
  .dots button::before { content: ''; width: 8px; height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .5); transition: width .2s; }
  .dots [aria-current="true"]::before { width: 22px; background: var(--accent); }
  @media (min-width: 768px) { .banner { height: 500px; } .slide-t { bottom: 120px; } .slide-t h2 { font-size: 40px; } .bctl { bottom: 128px; right: 24px; } .dots { bottom: 84px; } }
  @media (min-width: 1280px) { .bctl { right: calc((100vw - 1280px) / 2 + 24px); } }

  .sb-wrap { position: relative; z-index: 5; margin-top: -60px; }
  .sb { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow-lg); padding: 14px; display: grid; gap: 12px; }
  .pillseg { display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; padding: 4px; overflow-x: auto; scrollbar-width: none; }
  .pillseg::-webkit-scrollbar { display: none; }
  .pillseg button, .pillseg a { flex: 1 0 auto; min-height: 44px; min-width: 44px; padding: 0 10px; border-radius: 99px; font-weight: 600; color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; }
  .pillseg [aria-selected="true"], .pillseg [aria-current="true"] { background: var(--primary); color: #fff; box-shadow: var(--shadow); }
  .sb-f { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kw { grid-column: 1 / -1; position: relative; }
  .kw .i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .kw .input { padding-left: 44px; }
  .sb-f [data-dd=price] { grid-column: 1 / -1; }
  .sb-go { grid-column: 1 / -1; min-height: 52px; font-size: 17px; border-radius: 14px; }
  .adv-t { justify-self: start; min-height: 44px; color: var(--primary); font-weight: 600; display: inline-flex; gap: 4px; align-items: center; }
  .adv-t .i { transition: transform .15s; }
  .adv-t[aria-expanded="true"] .i { transform: rotate(180deg); }
  .adv { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px 16px; padding-top: 4px; border-top: 1px dashed var(--line); }
  .sb-bot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .sb-bot small { color: var(--muted); }
  @media (min-width: 640px) { .pillseg { display: inline-flex; justify-self: start; } .pillseg button, .pillseg a { padding: 0 16px; } .adv { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (min-width: 1024px) {
    .sb { padding: 18px 20px; }
    .sb-f { grid-template-columns: minmax(0, 2fr) repeat(3, minmax(0, 1fr)) auto; }
    .kw, .sb-f [data-dd=price] { grid-column: auto; }
    .sb-go { grid-column: auto; padding: 0 32px; min-height: 48px; }
  }

  .sec { padding: 32px 0 4px; }
  .sec-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .sec-h h2 { font-size: 22px; line-height: 1.35; }
  .sec-h p { color: var(--muted); font-size: 15px; }
  .more { color: var(--primary); font-weight: 600; display: inline-flex; align-items: center; min-height: 44px; flex: none; }
  @media (min-width: 768px) { .sec { padding: 48px 0 4px; } .sec-h h2 { font-size: 28px; } }

  .tchips { gap: 8px; margin: 0 -16px; padding: 0 16px 4px; }
  .tchip { flex: none; min-height: 48px; padding: 0 18px 0 8px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 10px; font-weight: 600; white-space: nowrap; }
  .tchip .ic { width: 34px; height: 34px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; }
  .tchip .ic .i { width: 20px; height: 20px; }
  @media (min-width: 768px) { .tchips { margin: 0; padding: 0 0 4px; flex-wrap: wrap; overflow: visible; } }
  @media (hover: hover) { .tchip:hover { border-color: var(--primary); } }

  /* การ์ดโครงการ */
  .prow { gap: 16px; margin: 0 -16px; padding: 0 16px 8px; }
  .pcard { flex: 0 0 86%; max-width: 380px; scroll-snap-align: start; position: relative; background: var(--surface); border-radius: var(--r-card); overflow: hidden; border: 1px solid var(--line); display: flex; flex-direction: column; }
  @media (min-width: 768px) { .prow { margin: 0; padding: 0 0 8px; } .pcard { flex-basis: 360px; } }
  @media (min-width: 1024px) { .prow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); overflow: visible; } .pcard { max-width: none; } }
  .pcard .media { position: relative; aspect-ratio: 16 / 10; }
  .pcard .media > svg { width: 100%; height: 100%; }
  .ribbon { position: absolute; left: 12px; bottom: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 13px; padding: 4px 12px; border-radius: 99px; display: inline-flex; gap: 6px; align-items: center; }
  .ribbon .i { width: 16px; height: 16px; }
  .status { position: absolute; left: 12px; top: 12px; background: rgba(255, 255, 255, .95); color: var(--ok); font-weight: 700; font-size: 12px; padding: 2px 10px; border-radius: 99px; }
  .heart { position: absolute; top: 4px; right: 4px; width: 44px; height: 44px; display: grid; place-items: center; z-index: 2; }
  .heart span { width: 36px; height: 36px; border-radius: 50%; background: rgba(255, 255, 255, .95); display: grid; place-items: center; }
  .heart .i { width: 18px; height: 18px; }
  .pcard .b { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .dev { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
  .dev .lg { width: 26px; height: 26px; border-radius: 8px; background: var(--deep); color: #fff; font-weight: 700; font-size: 11px; display: grid; place-items: center; }
  .pcard h3 { font-size: 18px; line-height: 1.4; }
  .pcard h3 a::after, .lcard h3 a::after { content: ''; position: absolute; inset: 0; z-index: 1; }
  .meta { font-size: 14px; color: var(--muted); display: flex; gap: 4px; align-items: center; line-height: 1.45; }
  .meta .i { width: 16px; height: 16px; }
  .from { margin-top: auto; padding-top: 10px; display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .from small { color: var(--muted); font-size: 13px; display: block; }
  .from b { font-family: var(--font-h); font-weight: 600; font-size: 22px; color: var(--primary); line-height: 1.2; }
  .from .u { font-size: 13px; color: var(--muted); }

  /* การ์ดประกาศ */
  .lgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  @media (min-width: 640px) { .lgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (min-width: 1024px) { .lgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); } .lgrid.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .lcard { position: relative; background: var(--surface); border-radius: var(--r-card); border: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; transition: transform .15s, box-shadow .15s; }
  @media (hover: hover) { .lcard:hover, .pcard:hover { box-shadow: var(--shadow-lg); } }
  .lcard .media { position: relative; aspect-ratio: 4 / 3; }
  .lcard .media > svg { width: 100%; height: 100%; }
  .chipz { position: absolute; left: 10px; top: 10px; display: flex; gap: 4px; flex-wrap: wrap; max-width: calc(100% - 60px); }
  .cz { white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: rgba(255, 255, 255, .95); color: var(--ink); }
  .cz-hot, .cz-promo { background: var(--accent); color: var(--accent-ink); }
  .cz-new { background: var(--primary); color: #fff; }
  .cz-verified { color: var(--ok); }
  .lcard .b { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .lcard .pz { font-family: var(--font-h); font-weight: 600; font-size: 20px; line-height: 1.3; }
  .lcard .pz small { font-family: var(--font); font-size: 13px; color: var(--muted); font-weight: 500; }
  .lcard h3 { font-family: var(--font); font-size: 16px; font-weight: 600; line-height: 1.45; }
  .specs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 8px; }
  .specs span { font-size: 13px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 1px 8px; display: inline-flex; gap: 4px; align-items: center; }
  .specs .i { width: 14px; height: 14px; color: var(--muted); }
  .by { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); padding-top: 8px; }
  .by .av { width: 24px; height: 24px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-weight: 700; font-size: 11px; flex: none; }
  .by .nm { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .by time { margin-left: auto; flex: none; }
  .lgrid.rows { grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 768px) { .lgrid.rows .lcard { flex-direction: row; } .lgrid.rows .media { width: 300px; flex: none; aspect-ratio: auto; min-height: 200px; } }

  .zones { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px; display: grid; gap: 12px; }
  .zcloud { display: flex; flex-wrap: wrap; gap: 8px; }
  .zcloud a { min-height: 44px; padding: 0 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
  .zcloud small { color: var(--muted); font-size: 13px; }
  @media (hover: hover) { .zcloud a:hover { border-color: var(--primary); color: var(--primary); } }

  .tools { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .tool { position: relative; border-radius: 18px; padding: 18px; display: flex; gap: 14px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); text-align: left; width: 100%; min-height: 96px; }
  .tool .ic { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); flex: none; }
  .tool h3 { font-size: 17px; }
  .tool p { color: var(--muted); font-size: 14px; line-height: 1.5; }
  .tool.dark { background: var(--deep); color: #fff; border-color: var(--deep); }
  .tool.dark p { color: var(--deep-muted); }
  .tool.dark .ic { background: var(--accent); color: var(--accent-ink); }
  @media (min-width: 768px) { .tools { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (hover: hover) { .tool:hover { border-color: var(--primary); } }

  .ftr { margin-top: 56px; background: var(--deep); color: var(--deep-muted); padding: 36px 0 calc(24px + env(safe-area-inset-bottom)); font-size: 15px; }
  .ftr-g { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  .ftr h3 { color: #fff; font-size: 16px; margin-bottom: 6px; }
  .ftr a { min-height: 44px; display: flex; align-items: center; }
  .ftr .brand { grid-column: 1 / -1; }
  @media (min-width: 1024px) { .ftr-g { grid-template-columns: 2fr 1fr 1fr 1fr; } .ftr .brand { grid-column: auto; } }

  /* ค้นหา */
  .s-top { background: var(--surface); border-bottom: 1px solid var(--line); padding: 8px 0 12px; }
  .crumb { font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .crumb a { color: var(--primary); min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; }
  .s-top h1 { font-size: 22px; line-height: 1.35; }
  .s-top h1 + p { color: var(--muted); }
  .s-ctl { display: flex; gap: 8px; align-items: center; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
  .s-ctl::-webkit-scrollbar { display: none; }
  .s-ctl .pillseg { flex: none; }
  .fchip { flex: none; min-height: 44px; padding: 0 16px; border-radius: 99px; border: 1px solid var(--line-strong); background: var(--surface); display: inline-flex; align-items: center; gap: 6px; font-weight: 600; white-space: nowrap; }
  .fchip.on { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-strong); }
  .fchip .n { min-width: 20px; height: 20px; border-radius: 99px; background: var(--primary); color: #fff; font-size: 12px; display: grid; place-items: center; padding: 0 5px; }
  .s-bar { display: flex; align-items: center; gap: 8px; justify-content: space-between; padding: 14px 0 10px; flex-wrap: wrap; }
  .s-bar .dd { min-width: 180px; }
  .vt { display: none; }
  @media (min-width: 768px) { .vt { display: inline-flex; } .s-top h1 { font-size: 28px; } }
  .save { color: var(--primary); }
  .loadmore { display: flex; justify-content: center; padding-top: 24px; }
  .empty { background: var(--surface); border: 1px dashed var(--line-strong); border-radius: 18px; padding: 40px 20px; text-align: center; display: grid; gap: 10px; justify-items: center; }
  .empty .ei { width: 64px; height: 64px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; }
  .sheet-panel h2 { font-size: 20px; }
  .sh-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  @media (min-width: 640px) { .sh-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .sh-foot { position: sticky; bottom: calc(-16px - env(safe-area-inset-bottom)); background: var(--surface); display: flex; gap: 10px; padding: 12px 0 0; border-top: 1px solid var(--line); }
  .sh-foot .btn { flex: 1; }

  /* รายละเอียด */
  .dhero { position: relative; height: 380px; color: #fff; overflow: hidden; background: var(--deep); }
  .dhero > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .dhero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11, 27, 63, .1) 30%, rgba(11, 27, 63, .85)); }
  .dhero .wrap { position: absolute; left: 0; right: 0; bottom: 20px; z-index: 1; }
  .dhero h1 { font-size: 24px; line-height: 1.3; margin: 6px 0 2px; }
  .dhero .meta { color: #E3E9F6; }
  .dhero .px { font-family: var(--font-h); font-size: 26px; color: var(--accent); margin-top: 6px; }
  .dhero .px small { font-family: var(--font); font-size: 15px; color: #E3E9F6; }
  .dtools { position: absolute; z-index: 2; top: 12px; right: 12px; display: flex; gap: 6px; }
  .dtools .ib { background: rgba(255, 255, 255, .95); color: var(--ink); }
  .dtools .btn { background: rgba(255, 255, 255, .95); color: var(--ink); }
  @media (min-width: 768px) { .dhero { height: 460px; } .dhero h1 { font-size: 38px; } .dhero .px { font-size: 32px; } }
  .dl { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; padding: 20px 0 24px; }
  @media (min-width: 1024px) { .dl { grid-template-columns: minmax(0, 1fr) 360px; gap: 32px; } }
  .tabs-row { position: sticky; top: 64px; z-index: 20; background: var(--bg); padding: 8px 0; }

<script>

  }

  function home() {
    var resale = B.LISTINGS.filter(function (h) { return h.market === 'resale'; }).slice(0, 8);
    var ZONES = {
      bkk: [['สุขุมวิท', 4210], ['อารีย์ – พหลโยธิน', 1240], ['พระราม 9 – รัชดา', 1876], ['สาทร – สีลม', 1630], ['ลาดพร้าว', 1105], ['บางนา', 1530], ['รามอินทรา', 870]],

          '<p class="from">' + (h.deal === 'rent' ? 'ค่าเช่า ' : 'ราคาเริ่ม ') + '<b>' + (h.deal === 'rent' ? B.baht(h.price) + '/เดือน' : '฿' + B.short(h.price)) + '</b></p><a class="btn btn-white" href="#/homes/' + h.slug + '">ดูรายละเอียด' + I('right') + '</a></div></div></div>';
      }).join('') + '</div>' +

    press('[data-day]'); press('[data-time]');
    B.$('#tel').addEventListener('click', function (e) { e.currentTarget.querySelector('span').textContent = a.phone; });
    if (h.deal === 'sale') {
      var upd = function () {
        var d = +B.$('#d-down').value, y = +B.$('#d-yr').value; B.$('#d-down-v').textContent = d + '%'; B.$('#d-yr-v').textContent = y + ' ปี';
        B.$('#d-out').textContent = B.baht(B.mortgage(h.price, d, y, 3.5)) + '/เดือน'; B.$('#d-loan').textContent = 'วงเงินกู้ ' + B.baht(h.price * (1 - d / 100));
      };
      ['d-down', 'd-yr'].forEach(function (id) { B.$('#' + id).addEventListener('input', upd); }); upd();
    }
    B.$('#bk').addEventListener('submit', function (e) {
      e.preventDefault(); var err = B.$('#b-err');
      if (!B.$('#b-name').value.trim()) { err.textContent = 'กรุณากรอกชื่อสำหรับนัดหมาย'; B.$('#b-name').focus(); return; }
      if (!/^0\d{1,2}-?\d{3}-?\d{4}$/.test(B.$('#b-tel').value.trim())) { err.textContent = 'เบอร์โทรไม่ถูกต้อง — กรอก 10 หลัก เช่น 081-234-5678'; B.$('#b-tel').focus(); return; }
      if (!B.$('#b-ok').checked) { err.textContent = 'กรุณาติ๊กยินยอมส่งข้อมูลก่อนยืนยัน'; return; }
      var day = B.$('[data-day][aria-pressed="true"]').getAttribute('aria-label'), time = B.$('[data-time][aria-pressed="true"]').dataset.time;
      e.target.innerHTML = '<div class="empty" style="border-style:solid"><span class="ei">' + I('check') + '</span><strong>นัดชมเรียบร้อย</strong><span>' + day + ' เวลา ' + time + ' น.</span><span style="color:var(--muted);font-size:14px">' + esc(a.name) + ' จะโทรยืนยันอีกครั้ง</span></div>';
    });
  }

  // sheet คำนวณสินเชื่อ (หน้าแรก)
  var calc = B.$('#calc');
  var kUpd = function () {
    var price = parseFloat(B.$('#k-price').value.replace(/,/g, '')) || 0, d = +B.$('#k-down').value, y = +B.$('#k-yr').value;
    B.$('#k-down-v').textContent = d + '%'; B.$('#k-yr-v').textContent = y + ' ปี'; B.$('#k-out').textContent = B.baht(B.mortgage(price, d, y, 3.5)) + '/เดือน';
  };
  ['k-price', 'k-down', 'k-yr'].forEach(function (id) { B.$('#' + id).addEventListener('input', kUpd); }); kUpd();
  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-open-calc]')) { calc.hidden = false; document.documentElement.classList.add('lock'); B.$('#k-price').focus(); }
    else if (e.target.closest('[data-sheet-close]') || e.target === calc) { calc.hidden = true; document.documentElement.classList.remove('lock'); }
  });

  B.$('#drawer-links').innerHTML = '<a href="#/">' + I('home') + 'หน้าแรก</a>' + NAV.map(function (n) { return '<a href="' + B.href('/search', n.q) + '">' + I('search') + n.label + '</a>'; }).join('');
  B.$('#ftr').innerHTML = '<div class="wrap"><div class="ftr-g"><div class="brand"><strong style="font-family:var(--font-h);font-size:22px;color:#fff">BaanHub</strong><p style="max-width:40ch;margin-top:4px">รวมโครงการใหม่และบ้านมือสองทั่วไทย พร้อม agent ที่ตรวจสอบแล้ว</p></div>' +
    '<div><h3>ค้นหา</h3><a href="#/search?deal=sale&market=new">โครงการใหม่</a><a href="#/search?deal=sale">ซื้อ</a><a href="#/search?deal=rent">เช่า</a></div><div><h3>ขาย / ฝาก</h3><a href="#/post" onclick="BH.toast(\'ไปหน้าลงประกาศ\');return false">ลงประกาศ</a><a href="#/agent-login" onclick="BH.toast(\'ไปหน้าเข้าสู่ระบบ agent\');return false">เข้าสู่ระบบ agent</a></div>' +
    '<div><h3>ช่วยเหลือ</h3><a href="#help">คำถามที่พบบ่อย</a><a href="#privacy">ความเป็นส่วนตัว</a></div></div><p style="margin-top:20px;font-size:13px">© 2569 BaanHub · ข้อมูลตัวอย่าง</p></div>';
  B.start(function (st) {
    B.$('#nav').innerHTML = NAV.map(function (n) {
      var on = st.view === 'search' && Object.keys(n.q).every(function (k) { return st.q[k] === n.q[k]; }) && (n.q.market || !st.q.market);
      return '<a href="' + B.href('/search', n.q) + '"' + (on ? ' aria-current="page"' : '') + '>' + n.label + '</a>';
    }).join('');
    if (st.view === 'search') search(st); else if (st.view === 'detail') detail(st); else home();
    B.$$('[data-fav-count]').forEach(function (x) { x.textContent = B.favCount(); x.hidden = !B.favCount(); });
    document.title = 'BaanHub · 5C Showcase — ' + (st.view === 'home' ? 'หน้าแรก' : st.view === 'search' ? 'ค้นหา' : 'รายละเอียด');
  });
})();
</script>
</body>
</html>
